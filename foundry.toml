[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 200
extra_output = ["evm.legacyAssembly", "storageLayout"]
# StatementHash.t.sol differential-tests the spec 10.2 encoder against the Rust
# reference vectors.
# Vendored circuit outputs: the reference vectors and a real proof. Copied from
# the circuits repository because Foundry cannot read outside its project root.
# See test/fixtures/README.md for how to regenerate them.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
# Verifier.sol is generated by the circuits repo's export-verifier binary and
# copied in verbatim. Formatting it here would be undone by the next export and
# would make the two copies diff against each other, so it is excluded rather
# than reformatted.
ignore = ["src/Verifier.sol"]
