[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Keep compiler metadata stable across Foundry versions and dependency checkouts.
auto_detect_remappings = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "erc4626-tests/=lib/openzeppelin-contracts/lib/erc4626-tests/",
    "forge-std/=lib/forge-std/src/",
    "halmos-cheatcodes/=lib/openzeppelin-contracts/lib/halmos-cheatcodes/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "lib/openzeppelin-contracts/:forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]
via_ir = true
optimizer = true
optimizer_runs = 200
evm_version = "prague"
extra_output = ["evm.legacyAssembly", "storageLayout"]
# StatementHash.t.sol differential-tests the spec 10.2 encoder against the Rust
# reference vectors.
# Vendored circuit outputs: the reference vectors and a real proof. Copied from
# the circuits repository because Foundry cannot read outside its project root.
# See test/fixtures/README.md for how to regenerate them.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[fmt]
# Verifier.sol is generated by the circuits repo's export-verifier binary and
# copied in verbatim. Formatting it here would be undone by the next export and
# would make the two copies diff against each other, so it is excluded rather
# than reformatted.
ignore = ["src/Verifier.sol", "src/NativeVerifier.sol", "src/BatchVerifier.sol", "src/BatchNativeVerifier.sol"]
